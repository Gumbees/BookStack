[package]
name = "collab-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
yrs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
web-sys = { version = "0.3", features = [
    "BinaryType",
    "Blob",
    "CloseEvent",
    "ErrorEvent",
    "FileReader",
    "MessageEvent",
    "WebSocket",
    "console",
] }
wasm-bindgen-futures = "0.4"
gloo-utils = "0.2"

[profile.release]
opt-level = "s"
